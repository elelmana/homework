<!DOCTYPE html>
<html class="page" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./icons/nike-favicon-48x48.ico" type="image/x-icon">
  <link rel="stylesheet" href="./css/index.css">
  <script defer src="./js/index.js" type="module"></script>
  <title>Nike Air Mag</title>
</head>
<body class="page__body">
  <header class="header">
    <div class="container header__container">
      <a href="#" class="header__logo logo">
        <img 
        width="50" 
        height="20"
        src="./icons/лого.svg" 
        alt="Логотип Nike" 
        class="header__logo-img">
      </a>
      <nav class="menu header__menu" id="header__menu" aria-label="Главное меню">
        <ul class="menu__list">
          <li class="menu__item">
            <a href="#air Mag" class="menu__item-link" lang="en">Air Mag</a>
          </li>
          <li class="menu__item">
            <a href="#sizes" class="menu__item-link">Размеры</a>
          </li>
          <li class="menu__item">
            <a href="#characteristics" class="menu__item-link">Характеристики</a>
          </li>
          <li class="menu__item">
            <a href="#another-models" class="menu__item-link">Другие ТОП модели</a>
          </li>
        </ul>
      </nav>
      <div class="header__controls">
        <a href="#" class="header__order">Сделать заказ</a>
        <div class="header__actions">
          <button class="header__actions-button" aria-label="поиск" title="Поиск">
            <svg width="24" height="24">
              <use 
              class="header__actions-icon" 
              href="./icons/sprite.svg#search">
            </use>
            </svg>
          </button>
          <button 
          class="header__actions-button" 
          aria-label="корзина" 
          title="Корзина">
            <svg 
            width="24" 
            height="24">
              <use 
              class="header__actions-icon" 
              href="./icons/sprite.svg#cart">
            </use>
          </button>
          <button class="header__burger burger" aria-label="Открыть меню" aria-expanded="false" aria-controls="header__menu">
            <svg width="24" height="24">
              <use class="burger__icon-menu" href="./icons/sprite.svg#menu-burger"></use>
              <use class="burger__icon-cross" href="./icons/sprite.svg#menu-cross"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
    
  </header>
</body>
</html>
